<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT NAME | GPT-4</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e0ecf8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            width: 90%;
            max-width: 1200px;
            background: white;
            padding: 20px;
            border: 2px solid black;
            display: flex;
            flex-direction: column;
            height: 80%;
        }
        .top-menu {
            display: flex;
            justify-content: space-evenly;
            padding: 10px;
            background: #b0c4de;
        }
        .promptBox {
            display: flex;
            flex-direction: column;
            margin-top: 6%;
        }
        .contentStack {
            display: flex;
            flex-direction: column;
        }
        .top-menu button {
            padding: 1%;
            border: none;
            background: #5a79a5;
            color: white;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
        }
        .top-menu button:hover {
            background: #48658e;
        }
        .header {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            padding: 5px;
            background: #b0c4de;
        }
        .content {
            display: flex;
            justify-content: space-between;
            flex-direction: row;
            padding: 10px;
            height: 80%;
            margin-left: 15%;
            margin-right: 5%;
            overflow: auto;
        }
        .box {
            flex: 1;
            border: 2px solid black;
            padding: 10px;
            margin: 5px;
            background: white;
        }
        .singleBox {
            flex: 1;
            border: 2px solid black;
            padding: 2%;
            background: white;
            display: flex;
            overflow:auto;
            margin-top: 3%;
            margin-bottom: 3%;
            width: 60%;
            height: 100%;
        }
        .footer {
            text-align: center;
            font-size: 14px;
            padding: 10px;
            font-style: italic;
        }
        .generateButton {
            background-color: aquamarine;
            border-radius: 25px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: medium;
            width: 25%;
            height: 10%;
            display: block;
            margin-top: 1%;
            margin-bottom: 1%;
            font-size: larger;
            margin-left: 15%;
        }

        @media (max-width: 768px) {
            .content {
                flex-direction: column;
                align-items: center;
            }
            .box {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-menu">
            <button onclick="location.href='about'">About</button>
            <button onclick="location.href='index'">GPT-4</button>
        </div>
        <div class="header">GPT-4 Logical Reasoning Demo</div>
        <p style="margin-left: 15%; font-weight: bold;">Click the 'Generate' button below</p>
        <div class="content">
            <div class="contentStack">
                <div class="promptBox">
                    <strong>Scenario:</strong>
                    <div class="singleBox" id="scenarioBox"></div>
                </div>
                <div class="promptBox" style="margin-top: 5%;">
                    <strong>GPT-4 Response:</strong>
                    <div class="singleBox" id="responseBox"></div>
                </div>
            </div>
        </div>
        <button class="generateButton" id="generateScenarioButton">Generate</button>
        <!--<button class="generateButton" id="generateResponseButton">Generate Response</button>-->
        <div class="footer">CS555 Responsible AI - Final Project by Jeremy Lim, Collin Shields, Pedro Brussarski</div>
    </div>

    <script>
    async function generateScenarioAndQuestions() {
        try {
            const response = await fetch('/get_failure_example', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            });
            
            const data = await response.json();
            
            if (data.success) {
                document.getElementById("scenarioBox").innerText = data.prompt;
                document.getElementById("responseBox").innerText = data.response;
            } else {
                alert('No failure examples available yet. Please wait.');
            }
        } catch (error) {
            console.error('Error generating scenario and questions:', error);
            alert('Failed to generate scenario and questions. Please try again.');
        }
    }

    // Event listener for 'Generate Scenario & Questions' button
    document.getElementById("generateScenarioButton").addEventListener("click", generateScenarioAndQuestions);
