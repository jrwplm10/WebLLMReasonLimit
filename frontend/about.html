<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT NAME | ABOUT</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e0ecf8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            width: 90%;
            max-width: 1200px;
            background: white;
            padding: 20px;
            border: 2px solid black;
            display: flex;
            flex-direction: column;
            height: 80%;
        }
        .top-menu {
            display: flex;
            justify-content: space-evenly;
            padding: 10px;
            background: #b0c4de;
        }
        .promptBox {
            display: flex;
            flex-direction: column;
        }
        .contentStack {
            display: flex;
            flex-direction: column;
        }
        .top-menu button {
            padding: 1%;
            border: none;
            background: #5a79a5;
            color: white;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
        }
        .top-menu button:hover {
            background: #48658e;
        }
        .header {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            padding: 5px;
            background: #b0c4de;
        }
        .content {
            display: flex;
            justify-content: space-between;
            flex-direction: row;
            padding: 10px;
            height: 80%;
            margin-left: 15%;
            margin-right: 5%;
            overflow: auto;
        }
        .box {
            flex: 1;
            border: 2px solid black;
            padding: 10px;
            margin: 5px;
            background: white;
        }
        .singleBox {
            flex: 1;
            border: 2px solid black;
            padding: 6%;
            background: white;
            display: flex;
            overflow:auto;
            margin-top: 3%;
            margin-bottom: 3%;
            width: 100%;
            height: 100%;
        }
        .footer {
            text-align: center;
            font-size: 14px;
            padding: 10px;
            font-style: italic;
        }
        .generateButton {
            background-color: aquamarine;
            border-radius: 25px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: medium;
            width: 25%;
            height: 10%;
            display: block;
            margin-top: 1%;
            margin-bottom: 1%;
            font-size: larger;
            margin-left: 15%;
        }

        @media (max-width: 768px) {
            .content {
                flex-direction: column;
                align-items: center;
            }
            .box {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-menu">
            <button onclick="location.href='about'">About</button>
            <button onclick="location.href='index'">LLM1</button>
            <button onclick="location.href='llm2'">LLM2</button>
            <button onclick="location.href='llm3'">LLM3</button>
        </div>
        <div class="header">ABOUT</div>
        <div class="content">
            ADD ABSTRACT AND/OR INTRO TEXT HERE.
        </div>
        <div class="footer">Footer section - (About 16:9 Aspect Ratio)</div>
    </div>

</body>
</html>
